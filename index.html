<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Media Unit | Official Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f5ff;
            --secondary: #7B2CBF;
            --bg: #030303;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden; /* Loading වෙලාවේ Scroll බ්ලොක් කරනවා */
        }

        /* --- MINIMAL CIRCLE LOADER (5s) --- */
        #loader-wrapper {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .loader-container {
            position: relative;
            width: 80px;
            height: 80px;
        }

        /* කුඩා ප්‍රිමියම් සර්කල් එක */
        .premium-circle {
            width: 100%;
            height: 100%;
            border: 2px solid rgba(0, 245, 255, 0.1);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-logo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: #fff;
            font-weight: 800;
        }

        /* --- MAIN CONTENT (HIDDEN BY DEFAULT) --- */
        #main-content {
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            display: none; /* පේජ් එක මුලින්ම පෙන්නන්නේ නැහැ */
        }

        #cursor {
            position: fixed;
            width: 20px; height: 20px;
            background: var(--primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }

        .bg-gradient {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0a0a0a 0%, #030303 100%);
        }

        header {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        header h1 {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 800;
            letter-spacing: -3px;
            background: linear-gradient(to bottom, #fff 50%, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 20px;
        }

        #typewriter {
            font-size: 1rem;
            color: var(--primary);
            letter-spacing: 10px;
            font-weight: 300;
        }

        /* Responsive Grid */
        .container { width: 92%; max-width: 1400px; margin: 0 auto; padding-bottom: 100px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .card {
            position: relative;
            aspect-ratio: 4/5;
            border-radius: 45px;
            overflow: hidden;
            background: var(--glass);
            border: 1px solid var(--border);
            transition: transform 0.6s cubic-bezier(0.2, 1, 0.2, 1);
        }

        .card:hover { transform: scale(0.96) translateY(-10px); border-color: var(--primary); }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; }

        /* Always-on Premium Label */
        .label {
            position: absolute;
            bottom: 20px; left: 20px; right: 20px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            text-align: center;
        }

        .label h3 { font-size: 1.2rem; margin-bottom: 5px; }
        .label p { font-size: 0.7rem; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; }

        footer { padding: 100px; text-align: center; color: #333; letter-spacing: 5px; font-size: 0.7rem; }

        @media (max-width: 768px) {
            #cursor { display: none; }
            .grid { grid-template-columns: 1fr; }
            header h1 { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

    <!-- Loader Wrapper -->
    <div id="loader-wrapper">
        <div class="loader-container">
            <div class="premium-circle"></div>
            <div class="loader-logo">N_G</div>
        </div>
    </div>

    <!-- Cursor & Background -->
    <div id="cursor"></div>
    <div class="bg-gradient"></div>

    <!-- Main Content -->
    <div id="main-content">
        <div class="container">
            <header>
                <div id="typewriter"></div>
                <h1>MEDIA<br>UNIT.</h1>
                <p style="color: #444; margin-top: 30px; letter-spacing: 3px; font-size: 0.8rem;">OFFICIAL VISUAL ARCHIVE 2026</p>
            </header>

            <div class="grid" id="photoGrid"></div>

            <footer>
                MR HASHUU × NEXTGEN WEB STUDIO
            </footer>
        </div>
    </div>

    <script>
        // 1. Loader Logic (5 Seconds Delay)
        window.onload = () => {
            setTimeout(() => {
                const loader = document.getElementById('loader-wrapper');
                const content = document.getElementById('main-content');
                
                loader.style.opacity = '0';
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    content.style.display = 'block'; // Content එක පෙන්වනවා
                    setTimeout(() => {
                        content.style.opacity = '1';
                        document.body.style.overflow = 'auto'; // Scroll enable කරනවා
                        type(); // Typewriter එක පටන් ගන්නවා
                    }, 50);
                }, 1000); // Fade transition එකට වෙලාව
            }, 5000); // 5 Seconds Loading
        };

        // 2. Typewriter Effect
        const textElement = document.getElementById('typewriter');
        const phrases = ["CREATIVE POWER", "VISUAL MASTERY", "MR HASHUU ELITE"];
        let pIdx = 0, cIdx = 0, isDeleting = false;

        function type() {
            const current = phrases[pIdx];
            textElement.textContent = isDeleting ? current.substring(0, cIdx-1) : current.substring(0, cIdx+1);
            cIdx = isDeleting ? cIdx - 1 : cIdx + 1;
            
            let speed = isDeleting ? 50 : 100;
            if (!isDeleting && cIdx === current.length) { speed = 2000; isDeleting = true; }
            else if (isDeleting && cIdx === 0) { isDeleting = false; pIdx = (pIdx + 1) % phrases.length; speed = 500; }
            setTimeout(type, speed);
        }

        // 3. Custom Cursor
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // 4. Grid Generation (Always-on Labels)
        const grid = document.getElementById('photoGrid');
        for (let i = 1; i <= 20; i++) {
            grid.innerHTML += `
                <div class="card">
                    <img src="student${i}.jpg" alt="Member" onerror="this.src='https://via.placeholder.com/600x800/050505/222?text=NEXTGEN+VISUALS'">
                    <div class="label">
                        <h3>Elite Student ${i}</h3>
                        <p>Photography Unit</p>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
