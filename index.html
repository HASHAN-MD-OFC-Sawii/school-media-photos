<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Media Unit | Elite Visuals</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f5ff; /* Cyan Neon */
            --secondary: #7B2CBF; /* Purple Neon */
            --bg: #030303;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Luxury Custom Cursor */
        #cursor {
            position: fixed;
            width: 20px; height: 20px;
            background: var(--primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }

        /* Premium Dynamic Background */
        .bg-gradient {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0a0a0a 0%, #030303 100%);
        }

        .orb {
            position: absolute;
            width: 600px; height: 600px;
            background: var(--secondary);
            filter: blur(180px);
            border-radius: 50%;
            opacity: 0.1;
            animation: float 15s infinite alternate;
        }

        @keyframes float {
            0% { transform: translate(-10%, -10%) scale(1); }
            100% { transform: translate(20%, 20%) scale(1.2); }
        }

        /* Top Navigation with Sri Lanka Time */
        .nav-top {
            width: 100%;
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(3, 3, 3, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .logo { font-weight: 800; letter-spacing: 2px; color: #fff; }
        .logo span { color: var(--primary); }

        #sl-time {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--primary);
            font-weight: 400;
            background: rgba(0, 245, 255, 0.1);
            padding: 8px 15px;
            border-radius: 50px;
            border: 1px solid rgba(0, 245, 255, 0.2);
        }

        /* Header Section */
        header {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        header h1 {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 800;
            letter-spacing: -3px;
            line-height: 0.9;
            background: linear-gradient(to bottom, #fff 50%, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #typewriter {
            font-size: 1.1rem;
            color: var(--primary);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-shadow: 0 0 10px var(--primary);
        }

        /* Portfolio Grid */
        .container { width: 92%; max-width: 1400px; margin: 0 auto; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
            padding-bottom: 100px;
        }

        .card {
            position: relative;
            aspect-ratio: 4/5;
            border-radius: 40px;
            overflow: hidden;
            background: var(--glass);
            border: 1px solid var(--border);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover { transform: scale(0.97) translateY(-10px); border-color: var(--primary); }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; }

        /* Always-on Premium Label */
        .card-label {
            position: absolute;
            bottom: 20px; left: 20px; right: 20px;
            padding: 22px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            text-align: center;
        }

        .card-label h3 { font-size: 1.2rem; font-weight: 600; margin-bottom: 5px; }
        .card-label p { font-size: 0.7rem; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; }

        footer { padding: 80px; text-align: center; color: #333; letter-spacing: 5px; font-size: 0.7rem; }

        @media (max-width: 768px) {
            #cursor { display: none; }
            .grid { grid-template-columns: 1fr; }
            .nav-top { padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="cursor"></div>
    <div class="bg-gradient"><div class="orb"></div></div>

    <!-- Navigation with Sri Lanka Time -->
    <div class="nav-top">
        <div class="logo">NEXTGEN<span>STUDIO</span></div>
        <div id="sl-time">LOADING TIME...</div>
    </div>

    <div class="container">
        <header>
            <div id="typewriter"></div>
            <h1>MEDIA<br>LEGACY.</h1>
            <p style="color: #666; margin-top: 25px; letter-spacing: 2px; font-weight: 300;">OFFICIAL BATCH PORTFOLIO 2026</p>
        </header>

        <div class="grid" id="mainGrid"></div>

        <footer>
            DESIGNED BY MR HASHUU × NEXTGEN STUDIO
        </footer>
    </div>

    <script>
        // 1. Real-time Sri Lanka Clock
        function updateTime() {
            const options = { 
                timeZone: 'Asia/Colombo', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit', 
                hour12: true 
            };
            const formatter = new Intl.DateTimeFormat('en-US', options);
            document.getElementById('sl-time').textContent = 'SL TIME: ' + formatter.format(new Date());
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 2. Typewriter Effect
        const textElement = document.getElementById('typewriter');
        const phrases = ["CREATIVE POWER", "VISUAL MASTERY", "MR HASHUU ELITE"];
        let pIdx = 0, cIdx = 0, isDeleting = false;

        function type() {
            const current = phrases[pIdx];
            textElement.textContent = isDeleting ? current.substring(0, cIdx-1) : current.substring(0, cIdx+1);
            cIdx = isDeleting ? cIdx - 1 : cIdx + 1;
            
            let speed = isDeleting ? 50 : 100;
            if (!isDeleting && cIdx === current.length) { speed = 2000; isDeleting = true; }
            else if (isDeleting && cIdx === 0) { isDeleting = false; pIdx = (pIdx + 1) % phrases.length; speed = 500; }
            setTimeout(type, speed);
        }
        type();

        // 3. Custom Cursor
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // 4. Grid Generation
        const grid = document.getElementById('mainGrid');
        for (let i = 1; i <= 20; i++) {
            grid.innerHTML += `
                <div class="card">
                    <img src="student${i}.jpg" alt="Member" onerror="this.src='https://via.placeholder.com/600x800/0a0a0a/333?text=MEDIA+MEMBER'">
                    <div class="card-label">
                        <h3>Elite Student ${i}</h3>
                        <p>Photography Unit</p>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
